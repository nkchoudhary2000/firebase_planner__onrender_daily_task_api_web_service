<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#cc2200" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="50" cy="50" r="44" stroke="url(#glowRing)" stroke-width="2.5" fill="#12141a" filter="url(#glow)"/>
  
  <!-- Outer Clock Ring -->
  <circle cx="50" cy="50" r="38" stroke="url(#solarGrad)" stroke-width="3" stroke-dasharray="180 50" stroke-linecap="round" fill="none"/>
  
  <!-- Sun Rays / Time Ticks -->
  <line x1="50" y1="18" x2="50" y2="24" stroke="#ffaa33" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="50" y2="82" stroke="#ffaa33" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="50" x2="24" y2="50" stroke="#ffaa33" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="82" y2="50" stroke="#ffaa33" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Core Checkmark & Clock Hand -->
  <circle cx="50" cy="50" r="22" fill="url(#solarGrad)" opacity="0.15"/>
  <path d="M42 51 L48 57 L62 43" stroke="url(#solarGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
</svg>
